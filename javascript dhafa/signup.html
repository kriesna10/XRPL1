<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
    rel="stylesheet" 
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
    crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="logo-search-grid-2x.png" type="image/png">
</head>
<body class="full-page-gradient">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card p-4">
                    <div class="card-body">
                        <h4 class="text-center mb-4">Sign Up</h4>
                        <form id="signupForm">
                            <div class="mb-3">
                                <label for="regUsername" class="form-label">Username</label>
                                <input type="text" class="form-control" id="Username" placeholder="Username">
                            </div>
                            <div class="mb-3">
                                <label for="regEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="Email" placeholder="email@example.com">
                            </div>
                            <div class="mb-3">
                                <label for="regPassword" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Password">
                            </div>
                            <div class="mb-3">
                                <label for="regConfirmPassword" class="form-label">Konfirmasi Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Ulangi Password">
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Daftar</button>
                                <button type="reset" class="btn btn-secondary">Reset</button>
                                <a href="index.html" class="btn btn-outline-primary">Kembali ke Login</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.getElementById("signupForm").addEventListener("submit", function(event) {
        event.preventDefault();
        
        const username = document.getElementById("Username").value;
        const email = document.getElementById("Email").value;
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("password").value;

        if (!username || !email || !password) {
            alert("Semua field harus diisi!");
            return;
        }

        if (password !== confirmPassword) {
            alert("Password tidak cocok!");
            return;
        }

        if (password.length < 6) {
            alert("Password minimal 6 karakter!");
            return;
        }

        const users = JSON.parse(localStorage.getItem('users')) || [];
        const newUser = { username, email, password };
        users.push(newUser);
        localStorage.setItem('users', JSON.stringify(users));

        alert("Registrasi berhasil! Silakan login.");
        window.location.href = "index.html"; 
    });
    </script>
</body>
</html>
