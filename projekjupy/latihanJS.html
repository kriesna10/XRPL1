<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM LOGIN</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .full-page-gradient {
        height: 100vh;
        background: linear-gradient(135deg, #2FA084 0%, #8155ad 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        }
    
    
        </style>

 </head>
 <body class="full-page-gradient">
    <script>
     window.alert("selamat datang  di halaman login! yang berkesan");
    </script>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card p-4">
                    <div class="card-body">
                        <h4 class="text=center" mb-4>Form login</h4>
                        <form>
                            <div class="mb-3">
                            <label for ="username" class="form-label>">USERNAME</label>
                            <input
                            type="text"
                            class="form-control"
                            id="username"
                            placeholder="masukan username"
                            /> 
                        </div>
                            <label for ="password" class="form-label>">PASSWORD</label>
                            <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="masukan password"
                            />
                            </div>
                            <div class="d-grip gap-2">
                                <button type="submit" class="btn btn-primary w-100">LOGIN</button>
                                <button type="reset" class="btn btn-secondary w-100 mt-2">RESET</button>
                            
                            </div>
                        </form>
                   </div>
              </div>
          </div>
     </div>    
</div>
</body>
</html>
