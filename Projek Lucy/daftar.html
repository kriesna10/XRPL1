<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM DAFTAR</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style> 
        body, html {
            height: 100%;
            margin: 0;
        }
        .full-page-gradient {
            background: linear-gradient(135deg, #F4F8D3 0%, #932F67 50%, #F7CFD8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0; /* Memberi ruang saat layar kecil */
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.2);
        }
        .btn-success {
            background-color: #932F67; 
            border: none;
        }
        .btn-success:hover {
            background-color: #932F67;
        }
        .form-label {
            font-weight: 500;
        }
    </style>
</head>
<body class="full-page-gradient">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4">
                    <div class="card-body">
                        <h4 class="text-center mb-4">Buat Akun Baru</h4>
                        
                        <form action="#" method="POST">
                            <div class="mb-3">
                                <label for="fullname" class="form-label">Nama Lengkap</label>
                                <input type="text" class="form-control" id="fullname" placeholder="Masukkan nama lengkap" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="contoh@mail.com" required>
                            </div>

                            <div>
                                <label for="phone" class="form-label">No. Telepon</label>
                                <input type="tel" class="form-control" id="phone" placeholder="08123456789" required>
                            </div>

                            <div class="mb-3">
                                <label class=" form-label">Tanggal Lahir :
                                    <input type="date" class="form-control" id="dob" required>

                                </label>
                            </div>

                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" placeholder="Pilih username" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="password" placeholder="Password" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="confirm_password" class="form-label">Konfirmasi</label>
                                    <input type="password" class="form-control" id="confirm_password" placeholder="Ulangi password" required>
                                </div>
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="terms" required>
                                <label class="form-check-label small" for="terms">Saya setuju dengan Syarat & Ketentuan</label>
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-success">DAFTAR SEKARANG</button>
                                <a href="login.html" class="btn btn-outline-secondary">BATAL</a>
                            </div>
                        </form>

<div class="text-center mt-4">
    <p class="small">Sudah punya akun? 
        <a href="login.html" class="text-decoration-none" style="color: #932F67; font-weight: bold;">
            Login di sini
        </a>
    </p>
</div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
