<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM LOGIN</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style> 
        body, html {
            height: 100%;
            margin: 0;
        }
        .full-page-gradient {
            background: linear-gradient(135deg, #F4F8D3 0%, #932F67 50%, #F7CFD8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.2);
        }
        .btn-primary {
            background-color: #932F67;
            border: none;
        }
        .btn-primary:hover {
            background-color: #70234e;
        }
    </style>
</head>
<body class="full-page-gradient">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card p-4">
                    <div class="card-body">
                        <h4 class="text-center mb-4">Login</h4>
                        
                        <form>
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" placeholder="Masukkan username" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Masukkan password" required>
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary">LOGIN</button>
                                <button type="reset" class="btn btn-outline-secondary">RESET</button>
                            </div>
                        </form>

                        <div class="text-center mt-4">
    <p class="small">Belum punya akun? 
        <a href="daftar.html" class="text-decoration-none" style="color: #932F67; font-weight: bold;">
            Daftar Sekarang
        </a>
    </p>
</div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            console.log("Halaman siap!");
           
        };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
