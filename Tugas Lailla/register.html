<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM REGISTER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
   
    <style>
        .full-page-gradient {
            height: 100vh;
            background: linear-gradient(135deg,#BDA6CE 0%,#F9D0CD 50%,#FE9EC7 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn-primary {
            background-color: rgb(150, 1, 145);
            border:none;
        }
        

    
       
    </style>
</head>

<body class="full-page-gradient">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card p-4">
                    <div class="card-body">
                        <h4 class="text-center mb-4">Daftar Akun</h4>

                        <form>
                            <div class="mb-3">
                                <label class="form-label">Nama Lengkap</label>
                                <input type="text" class="form-control" placeholder="Masukkan nama lengkap">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Alamat Email</label>
                                <input type="email" class="form-control" placeholder="nama@gmail.com">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" placeholder="Buat password">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Konfirmasi Password</label>
                                <input type="password" class="form-control" placeholder="Ulangi password">
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Daftar</button>
                                <a href="tugas2.html" class="btn btn-outline-secondary">Kembali ke Login</a>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
    </button> 
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
</body>
</html>
