<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
       
        body {
            height: 100vh;
            background: linear-gradient(135deg,#BDA6CE 0%,#F9D0CD 50%,#FE9EC7 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .btn-primary {
            background: linear-gradient(45 deg, #BDA6CE, #F9D0CD);
            border:none
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .form-control:focus{
            box-shadow: none;
            border-color: #BDA6CE;
        }
        .login-icon {
            font-size: 50px;
            color: #FE9EC7;
        }
        

    
       
    </style>





<nav class="navbar navbar-dark bg-dark fixed-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Lailaaa Gemas</a>
    </div>
</nav>


<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card p-4 mt-5">
                <div class="card-body">

                    <div class="text-center mb-3">
                        <i class="bi bi-person-circle login-icon"></i>
                        <h4 class="mt-2">Masukkan Akun</h4>
                    </div>

                    <form>
                        <div class="mb-3">
                            <label class="form-label">Alamat Email</label>
                            <input type="email" class="form-control" placeholder="nama@gmail.com">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" placeholder="Masukkan Password Anda">
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remember">
                            <label class="form-check-label" for="remember">
                                Ingat akun saya
                            </label>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Masuk</button>
                            <button type="reset" class="btn btn-outline-secondary">Reset</button>
                            <a href="register.html" class="btn btn-outline-dark">Daftar</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
