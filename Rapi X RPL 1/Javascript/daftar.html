<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM DAFTAR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .full-page-gradient {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            border-radius: 12px;
            border: none;
        }
        .btn-register {
            background-color: #28a745;
            color: white;
        }
        .btn-register:hover {
            background-color: #218838;
            color: white;
        }
    </style>
</head>
<body class="full-page-gradient">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card p-4 shadow">
                    <div class="card-body">
                        <h4 class="text-center mb-4">Daftar</h4>
                        
                        <form>
                            <div class="mb-3">
                                <label for="new-username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="new-username" placeholder="Choose username" required>
                            </div>

                            <div class="mb-3">
                                <label for="new-password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="new-password" placeholder="Create password" required>
                            </div>

                            <div class="d-grid gap-2 mb-2">
                               <button type="submit" class="btn btn-register"
                                onclick="alert('Nice akun dah dibuat')">
                             Register
                               </button>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="reset" class="btn btn-secondary">Reset</button>
                            </div>
                        </form>

                        <hr class="mt-4">

                        <div class="text-center">
                            <p class="small mb-0">Sudah punya akun, Login lah! <a href="Latihan JS.html" class="text-decoration-none">Login</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
