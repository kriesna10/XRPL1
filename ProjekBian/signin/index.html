<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Sign In Form</title>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center" style="min-height:100vh">
        <div class="col-md-4">
            <form class="border p-4 shadow rounded" id="form">
                <div class="text-center mb-4">
                    <h2>Sign In</h2>
                </div>
                <div class="class mb-3">
                    <label for="username" class="form-label">Username</u></label>
                    <input type="text" name="" id="username" class="form-control" placeholder="Username">
                </div>
                <div class="class mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" name="" id="password" class="form-control" placeholder="Password">
                </div>
                <div class="class mb-3">
                    <input type="submit" value="Sign In" class="btn btn-primary w-100" id="submit">
                </div>
                    <p class="small">
                        Already have an Account? <a href="../login/index.html">Log in</a>
                    </p>
            </form>
        </div>
    </div>
    <script src="script/script.js"></script>
</body>
</html>
